AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
  MongoDbName:
    Type: String
    Default: communityhub
  EventTimezoneOffset:
    Type: String
    Default: '-06:00'
  ReminderWindowHours:
    Type: Number
    Default: 24

Resources:
  CapacityNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: communityhub-capacity-notification
      Runtime: nodejs22.x
      Handler: src/handler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName

  UpcomingEventReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: communityhub-upcoming-event-reminder
      Runtime: nodejs22.x
      Handler: src/reminderHandler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          EVENT_TIMEZONE_OFFSET: !Ref EventTimezoneOffset
          REMINDER_WINDOW_HOURS: !Ref ReminderWindowHours
      Events:
        HourlyReminder:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

Outputs:
  CapacityNotificationFunctionArn:
    Value: !GetAtt CapacityNotificationFunction.Arn
  UpcomingEventReminderFunctionArn:
    Value: !GetAtt UpcomingEventReminderFunction.Arn
